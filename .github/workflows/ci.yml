name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - name: Check shell scripts
        run: shellcheck kiro-usage.tmux scripts/*.sh examples/*.sh test/bin/*
      - name: Run tests
        run: bats test
